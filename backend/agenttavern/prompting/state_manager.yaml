# state_manager 的提示词。它管**这一轮之后世界变成了什么样**（S7）。
#
# 它跑在 writer 之后：拿到本轮的细纲和成文，把该记住的东西折成几个键值写进 state。
# 以前这活在 director 手上，边推演边记。换到后置买到两件事：
#
# - **记的人看得见最终写出来的是什么。** 细纲常常留白（「他含糊地应了一句」），
#   正文才落实成具体的话；边推演边记的人只能记那个含糊的版本。
# - **director 那一轮少了一件要惦记的事。**
#
# 代价写在明处：**这是每轮第四次模型调用，而且几乎没有缓存前缀**——除了开场白与
# 记法两节，其余每轮全变，前几轮的正文是最大的一块。实测 `data` 场景占掉全场
# 42% 的 input token。
#
# 顶上那个 `enabled` 是**这个 agent 跑不跑**（原 `Capabilities.state`，S80）：
# 关掉它这一路整个不跑，它的两个工具也跟着没有。
#
# `recent` 那条的 `runs` 是「给几轮示范」（原 `Capabilities.state_recent_runs`）。
# 往下调省钱，代价是键名和值的形状更容易漂移。
#
# 下面 `body` 里的正文**归用户**，随时会被整段重写，代码不依赖其中任何一句话。
# 所以它没有 spec、也没有断言钉措辞：钉住它等于把用户的改动变成一次红。
# 工具描述那一侧仍然钉着——判据不能有第二份副本，因为那一份用户改不到（S27）。
#
# **正文里不放例子。** 例子会被当成摆法照抄，用户实测时分不清模型的选择和我们
# 给的示范；结构该长什么样交给正文里的原则和 state 自身的现状（`state` 那节）。
# 参考资料放在 `docs/state_example/`（SillyTavern MVU 的三份世界书），不进上下文。

# -- 调用旋钮（S159）：用哪个模型、流不流、额外塞什么进请求体 --------------
#
# 它们按 agent 各设一份，因为它们本来就因 agent 而异。以前 `model` 和 `stream`
# 在 `.env` 里、全局一份，而它们全都在改「这一次调用长什么样」——那正是这份
# 文件管的事（同 S80 那次上调的判据）。
#
# `extra` **原样并进请求体**，一个字都不解释：思考模式那类参数各家拼法不同
# （`thinking: {type: enabled}` / `reasoning_effort: high` / `budget_tokens`），
# 定一套可移植的三档就要按家数映射，而猜错的症状是**不报错、只是没生效**。
model: deepseek-v4-flash
stream: true
extra: {}

enabled: true
sections:
- type: text
  role: system
  body: ''
- type: text
  role: user
  body: |-
    你负责维护一份**世界当前状态（state）**的速查表。
    state 的作用是给后续生成提供一条 shortcut：保存那些如果不直接展示，后续模型就可能需要重新阅读和推演前文才能可靠获得的信息。
    不要创作新内容，不要评价正文。使用工具进行必要的增、删、改；工具可以多次调用或者一次都不调用。
- type: text
  role: user
  body: |-
    # 记录当前状态
    事实性的当前状态包括：
    - 人物的位置、在场情况、死亡、伤势、身份
    - 持有的重要物品、金钱、资源等
    - 已成立且仍影响后续的人物关系、权限、限制
    - 谁知道或不知道的重要信息
    - 事件的倒计时
    - 已经发生、但位于当前场景之外且仍会影响后续的世界状态

    记录当前结果，不要记录变化过程。

    # 记录悬置项
    悬置项（伏笔）包括：

    - 未履行的承诺
    - 未产生后续的被强调的重要物件
    - 未解决的待办或悬念

    判据是正文明确赋予了它后续预期，而这个预期尚未兑现。

    # 更新原则
    - 已变化的值必须更新；
    - 已失效的值必须删除；
    - 被新状态取代的旧状态不要保留；
    - 悬置项兑现后删除；
    - 不再具有后续价值的信息删除。

    不要把所有过去发生过的事件全部保留，只保留约束未来的事件。

    尤其注意位置、在场人物、时间、资源、倒计时等容易过期的状态。

    本轮没有发生变化的状态不要擅自修改。

    # 区分世界事实与角色的知情状态
    整个 state 记录了世界事实，不是对所有角色可知的。影响后续行为的角色的知情状态需要单独记录。

    ## 结构维护
    不强制固定 schema。优先沿用当前 state 已形成的结构，只在确有必要时新增字段或域。

    维护时遵循：
    - 一个事实只保留一处，避免重复表示；
    - 同类信息尽量沿用已有键名和结构；
    - 已有值的数据类型和形状尽量保持稳定；
    - 数量优先使用数字，二值状态优先使用布尔值；
    - 一个字段只表达一种状态，不把多个独立事实塞进同一句描述；
    - 清单只保存当前仍有效的项目，不积累历史；
    - 新建字段前检查是否已有字段表达同一事实；
    - 不要为了整理而无意义地重写结构。

- type: text
  role: user
  body: ''
- type: context
  role: user
  source: state
  # 状态给到第几层：深过这一层的子树只给项数，模型按需展开（S67）。
  depth: 2
- type: context
  role: user
  source: recent
  runs: 3
- type: context
  role: user
  source: outline
- type: context
  role: user
  source: prose
tools:
  state_write:
    enabled: true
    body: 记录本轮的状态变化。可多次调用，累积生效；没有变化就一次也不调。
  state_query:
    enabled: true
    body: 按路径展开世界状态。上下文里已给出结构，深过展开层级的子树与体量大的值只给了个数/字数，这里用来把它们取出来。
rendering:
  state_empty: （尚无记录）
  state_long: （{{chars}} 字，用 state_query 展开）
  state_deeper: （{{count}} 项，用 state_query 展开）
  delta_empty: （本轮无变化）
  recent_empty: （这是第一轮，前面没有可参照的记录。）
