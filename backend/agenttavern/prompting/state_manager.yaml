# state_manager 的提示词。它管**这一轮之后世界变成了什么样**（D143）。
#
# 它是第三个 agent，**跑在 writer 之后**：拿到本轮的细纲和成文，把该记住的东西
# 折成几个键值写进 state。以前这活在 director 手上，边推演边记。
#
# 换到后置买到两件事：
#
# - **记的人看得见最终写出来的是什么。** 细纲常常留白（"他含糊地应了一句"），
#   正文才落实成具体的话；边推演边记的人只能记细纲里那个含糊的版本。
# - **director 那一轮少了一件要惦记的事。** 它原先要在推演途中反复自问
#   "这个要不要记"，而它当时还不知道最后会写成什么样。
#
# 代价写在明处：**这是第四次模型调用，而且几乎没有缓存前缀**——下面除了
# `intro` / `tools` / `notation` 三节，其余每轮全变。前几轮的正文是最大的一块。
#
# ============================================================================
# 四种正文来源与 `sections` 的用法同 director.yaml，不重复。
# ============================================================================

sections:
  # **破限留空。** 它不写任何内容，只把已经写出来的东西折成键值，通常不需要；
  # 但它确实要读正文，端点若因此拒绝，在这里填。
  - {role: system, key: jailbreak}
  - {role: user, key: intro}
  - {role: user, title: 可用的工具, context: tools}
  - {role: user, title: 记法, key: notation}

  # ---- 以下每轮都变 ----
  - role: user
    title: 当前状态
    context: state
    outro: |
      **新增记录时优先复用上面已有的键名与形状**，避免同一概念出现多个写法。
      **上面任何一个键，只要本轮之后它的值不再成立，就要改掉或删掉**，留着的旧值会被当成事实，不会被当成过时信息。不再约束后续的键 `set` 成 `null`；删了不算丢东西，那件事仍然在前情里。

  # **给前几轮，为的是记法一致。** 它每轮都是一次干净的调用，看不见自己上一轮
  # 怎么想的；不给示范，键名和值的形状会一轮一个样，而漂移一旦发生就修不回来。
  # 「细纲 → 正文 → 当时记下的」这个三元组才是示范，少了任何一项都读不出
  # "什么样的事该记成什么样的键"。
  - role: user
    title: 前几轮
    intro: 以下是前几轮的细纲、成文，以及当时记下的状态变化。**照着它们的键名和形状写**，不要另起一套。
    context: recent

  - role: user
    title: 本轮细纲
    intro: 以下是这一轮定下的事实。
    context: outline
  - role: user
    title: 本轮成文
    intro: 以下是这一轮最终写出来的正文。细纲留白的地方以它为准。
    context: prose

intro: |
  你负责维护一份**世界当前状态**的速查表。你不创作，也不评价已经写出来的内容——你只回答一个问题：这一轮过去之后，后面每一轮都需要随时看见的那几条，有哪些变了。

  用工具把变化写下来。可以写好几次，写完就结束；确实什么都没变，就一次也不用调用。

# 实体—关系的记法。**留空，等你填**（D143）。
#
# 建模那一侧已经定了：**单向关系写成属性**——A 对 B 的信任是 A 的属性，
# 所以键的形状仍然是 `<实体>.<属性>`，不需要新的分隔符，`WorldState.grouped()`
# 也不用动。这里要写的是怎么鼓励模型按实体—关系去想，而不是只记一堆孤立的值。
notation: " "

# 它不写内容，所以默认不给破限。要填就填在这儿。
jailbreak: " "
