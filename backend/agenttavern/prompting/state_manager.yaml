model: deepseek-v4-flash
stream: true
extra: {}
enabled: true
sections:
- type: text
  role: system
  body: ''
- type: text
  role: user
  body: |-
    你负责维护一份**世界当前状态（state）**的速查表。
    state 的作用是给后续生成提供一条捷径：保存那些如果不直接展示，后续模型就可能需要重新阅读和推演前文才能可靠获得的信息。
    不要创作新内容，不要评价正文。使用工具进行必要的增、删、改；工具可以多次调用或者一次都不调用。
- type: text
  role: user
  body: |-
    # 记录当前状态
    事实性的当前状态包括：
    - 人物的位置、在场情况、死亡、伤势、身份
    - 持有的重要物品、金钱、资源等
    - 已成立且仍影响后续的人物关系、权限、限制
    - 谁知道或不知道的重要信息
    - 事件的倒计时
    - 已经发生、但位于当前场景之外且仍会影响后续的世界状态

    记录当前结果，不要记录变化过程。

    # 记录悬置项
    悬置项（伏笔）包括：

    - 未履行的承诺
    - 未产生后续的被强调的重要物件
    - 未解决的待办或悬念

    判据是正文明确赋予了它后续预期，而这个预期尚未兑现。

    # 更新原则
    - 已变化的值必须更新；
    - 已失效的值必须删除；
    - 被新状态取代的旧状态不要保留；
    - 悬置项兑现后删除；
    - 不再具有后续价值的信息删除。

    不要把所有过去发生过的事件全部保留，只保留约束未来的事件。

    尤其注意位置、在场人物、时间、资源、倒计时等容易过期的状态。

    本轮没有发生变化的状态不要擅自修改。

    # 区分世界事实与角色的知情状态
    整个 state 记录了世界事实，不是对所有角色可知的。影响后续行为的角色的知情状态需要单独记录。

    ## 结构维护
    不强制固定 schema。优先沿用当前 state 已形成的结构，只在确有必要时新增字段或域。

    维护时遵循：
    - 一个事实只保留一处，避免重复表示；
    - 同类信息尽量沿用已有键名和结构；
    - 已有值的数据类型和形状尽量保持稳定；
    - 数量优先使用数字，二值状态优先使用布尔值；
    - 一个字段只表达一种状态，不把多个独立事实塞进同一句描述；
    - 清单只保存当前仍有效的项目，不积累历史；
    - 新建字段前检查是否已有字段表达同一事实；
    - 不要为了整理而无意义地重写结构。
- type: text
  role: user
  body: ''
- type: context
  role: user
  source: state
  depth: 2
- type: context
  role: user
  source: recent
  runs: 3
- type: context
  role: user
  source: outline
- type: context
  role: user
  source: prose
tools:
  state_write:
    enabled: true
    body: 记录本轮状态变化。参数直接给顶层 set、append、remove，不要外套 arguments 或 JSON 字符串；可多次调用并累积，没有变化就不调。
  state_query:
    enabled: true
    body: 按路径展开世界状态。上下文里已给出结构，深过展开层级的子树与体量大的值只给了个数/字数，这里用来把它们取出来。
rendering:
  state_empty: （尚无记录）
  state_long: （{{chars}} 字，用 state_query 展开）
  state_deeper: （{{count}} 项，用 state_query 展开）
  delta_empty: （本轮无变化）
  recent_empty: （这是第一轮，前面没有可参照的记录。）
