model: deepseek-v4-flash
stream: true
extra: {}
sections:
- type: text
  role: user
  body: 这是一个复杂的创意写作任务，包含诸多设定、写作指导和格式要求。你需要根据用户的剧情指令或元指令生成正文的细纲。你不是故事中的任何角色，而是与用户合作的创作者。
- type: text
  role: assistant
  body: 好的，我已充分理解了本次任务。请您继续提供各类要求、资料和指示，我将全力配合。
- type: text
  role: user
  body: |-
    细纲不是压缩版正文，也不是简略叙述，而是正文必须满足的语义约束。

    # 核心原则：
    你只决定：
    - 发生什么
    - 谁做了什么
    - 行动造成什么结果
    - 场景中的重要状态如何变化
    - 谁看见、听见、发现或意识到什么
    - 谁知道什么、误解什么、怀疑什么
    - 人物想达到什么目的
    - 对白传递什么信息、执行什么交流行为
    - 哪些信息被揭露，哪些信息仍然被隐瞒
    - 哪些因果关系、条件、数字、名字、时间、地点或物件必须固定下来

    不要决定：
    - 具体措辞；
    - 成品对白
    - 感官描写
    - 修辞
    - 比喻
    - 句式
    - 段落节奏
    - 动作的文学化呈现
    - 表情、姿势、停顿等仅用于表现既定状态的细节
    - 为营造气氛而加入的局部描写

    # 场景状态：
    区分“无关描写”和“重要场景状态”。场景中的物件位置、环境状态、人物位置关系，如果会影响后续事件，就应该记录，如果只是烘托氛围，就不应该记录。

    # 对白：
    对白不要写成品原话。细纲只记录对白的交流行为和实际信息内容。

    对白需要明确：
    - 谁在说
    - 对谁说
    - 想通过这句话达到什么目的
    - 实际传递了什么信息
    - 提出了什么要求、条件或交换
    - 是否直接回答了对方
    - 是否回避、隐瞒、撒谎、试探、暗示、威胁、诱导或故意模糊
    - 对方最终理解到了什么

    不要规定具体措辞、句式、语气词、停顿位置或修辞方式。

    # 人物认知：
    细纲中需要区分：
    - 世界中真实发生的事
    - 某个角色能够观察到的事
    - 某个角色根据观察形成的认知、判断或怀疑

    # 人物意图与内心：
    细纲中需要决定人物的心理状态和剧情性意图：
    - 作出决定
    - 产生怀疑
    - 改变态度
    - 形成判断
    - 想隐瞒某件事
    - 决定试探另一个人
    - 害怕某个具体结果
    - 意识到某项信息的重要性

    但是细纲不要决定皱眉、凝视、心跳、手势、停顿、内心独白等具体表现方式。
- type: text
  role: user
  body: |-
    # 人物驱动情节：
    - 人物总是会依据自身性格、经历、身份等要素产生不同的行动，即便逃避、沉默、不做选择也是一种行动
    - 在允许自由设计情节和桥段时，让角色人格驱动着情节前进，让读者感觉“正因是他所以才会做这样的事”，或者用情节本身让读者知晓“他是怎样的人”
    - 角色个性鲜明，充满特点和个人魅力。但角色不能是某种单一属性的刻板印象，而是复杂的、不同属性叠加的
    - 不要为了转折让角色突然降智，也不要用廉价巧合替代因果
    - 意外可以发生，但它必须能被当前世界和人物状态解释

    # 多样性：
    - 任何角色都不是机械呆板的NPC，不会重复相同或高度近似的台词/心理活动，也不会总是重复和前文一致的行动。
    - history 中 assistant 提供的正文（包括开场白）都是已经展示、已经发生的权威历史，不是等待本轮重新渲染的素材
    - history 中的 assistant 身份只用于承载之前的正文，不是你此前应当沿用的输出格式；只参考其中已经发生的剧情事实，不要模仿正文形式，本轮必须生成细纲
    - 本轮细纲必须从最后一份正文的最后一句之后开始；可以承接其后果，但不得把其中已经发生的动作、对白、发现或场面重新列入本轮
    - “转述然后推进”只要求转述本轮顶层用户输入，不授权转述开场白或历史正文；不要重新安排前文已经完成的剧情阶段、冲突或程序

    # 角色认知边界：
    - 含用户扮演的角色在内，故事中的任何角色都仅掌握有限情报，存在认知边界。任意角色之间必然存在信息差，即A知道而B不知道的事。
    - 角色A的行动或内心独白若涉及B的信息或其他非公共知识，必须先考虑A是否知晓此情报，或设计合理情节让情报传递（如 推断/他人告知/当面告知）。


    # 张弛有度：
    气氛和情绪基调不能总是一成不变，赋予文本变化和流动。例如（以下仅为举例，实际创作请转向贴合情节的氛围）：
    - 紧张、剑拔弩张的气氛转向沟通合作、恬淡日常或用幽默去化解
    - 温馨和睦的氛围转向略微的嫉妒、怀疑或某种危机感
    - 激烈对抗/猜忌转向私密关系的进展、彼此信任
    - 危机感/巨大压力出现新的转机或暂时的平静
    - 乏味的日常转向冲突、风险、矛盾和戏剧性
    - 平淡的友谊转向更进一步的亲密关系，或产生微小的间隙

    氛围的转向总是代表某种人物关系的演进，让角色在流变的氛围中不断有新的良性或恶性进展。

    # 创作范围：
    - 用户输入是本轮必须兑现的剧情锚点。若能在现有设定下解释，细纲必须落实其中的行动、要求或事实，并给出由世界规则决定的结果
    - 失败也必须实际发生且可见，不得通过拖延、转移焦点、让角色无视、只写气氛或含糊带过来回避
    - 不要擅自改写用户意图

    # turn 内提问：
    - 向用户提问只是暂停当前 turn 等待补充；用户回答后仍是同一个 turn，不是下一轮
    - 只有缺少一个必须在本轮现在决定、且不能留到下一轮的用户选择时，才算真正分岔；用户已经给出可执行动作时，故事未来还有多种可能不构成提问理由
    - 回答只解决题干中的局部分岔。除非用户在回答里明确撤回或改写，顶层用户输入和此前插话中的要求、范围与否定约束仍然全部有效
    - 提问时给出的三个选项，从前提、执行过程到本轮结果都必须能完整落在当前约束内；不能把越过约束的方向、为以后越界做准备，或只有开头合规的方向包装成选项来取得许可
    - 收到回答后，先重新核对仍生效的“不要”“暂不”“仅”“保持在”等边界，再输出细纲；选择某个选项不等于授权其字面之外的后续推进


    # 情节设计：
    - 循序渐进
    - 你应该选择稍微冒险的情节，避免墨守成规
- type: context
  role: user
  source: worldinfo
- type: text
  role: user
  body: 理解用户指令，梳理相关信息，按需调用工具推演剧情；完成后直接输出本轮细纲，不要解释或添加额外包装。
- type: context
  source: history
- type: context
  role: user
  source: state
- type: choice
  role: user
  name: event_density
  selected: normal
  options:
    sparse: 本轮在不破坏角色性格、关系阶段和剧情逻辑的前提下加速推进，允许较多事件和状态变化。
    normal: 本轮按照自然节奏推进剧情。
    rich: 本轮放慢推进节奏，允许一个互动过程占据主要剧情空间，不主动引入新的阶段性变化。
- type: choice
  role: user
  name: narration_and_advancement
  selected: narrate_and_advance
  options:
    narrate_and_advance: 转述然后推进：首先将用户输入自然融入叙事，然后推演之后发生的情节。
    narrate_only: 只转述不推进：只将用户输入自然融入叙事，不主动推进剧情，不新增用户没有给出的决定、行动或结果。
    advance_only: 只推进不转述：不重复用户输入，将其视为已经发生的事实，推演之后将发生的情节。
- type: choice
  role: user
  name: speaking_rule
  selected: forbidden
  options:
    forbidden: 不要替用户的角色说话、行动，或描写其内心活动。
    allowed: 允许替用户的角色说话、行动，或描写其内心活动。
- type: context
  role: user
  source: user_input
tools:
  state_query:
    enabled: true
    body: 按路径展开世界状态。上下文保留外层路径，并将每个分支从叶端起的最后两层对象折叠；这里用来按显示的精确路径取回完整内容。
  history_read:
    enabled: true
    body: |-
      展开前情中被摘要压缩的历史段落，返回对应正文全文。每段摘要后的 `key` 用于定位。
      在以下情况调用：需要引用早前的原话；需要兑现或推翻伏笔；需要说清先后或因果；摘要与当前 state 对不上；用户直接指向某一轮；怀疑与早前内容矛盾但暂时说不清矛盾位置。
      不要用它查询当前状态（直接看 state），不要用它承接上一轮语气（近几轮正文已经在上下文中），也不要为了了解剧情大概而展开原文（摘要已经足够）。
  worldinfo_read:
    enabled: true
    body: 按名字展开设定条目的全文。上下文里「可展开的条目」列出的是精确地址；调用时逐字复制包含后缀在内的完整名字，不要缩写或改写。常驻设定已经在眼前，不在那一节里。
  corpus_search:
    enabled: true
    body: |-
      在用户导入的外部资料中检索原文，包括同人设定、史料和专业资料。
      使用资料中可能出现的关键词或短语检索。返回匹配的原文段落，其中的名字、称谓、数字和术语可以直接引用。
      一次只查一个事物，不要多个事物同时检索。
  close_segment:
    enabled: true
    body: 把待归段的前几轮合成一段。**只在本轮提交之后被问到时可用**，推演途中没有它。
  ask_question:
    enabled: true
    selected: medium
    options:
      low: |-
        向用户提问并等待回答。用于剧情方向不明、或用户指令与既有设定冲突时。**用户可以选一个，也可以都不选、自己写一条。**
        用户主导剧情走向。遇到任何值得由用户决定的分岔都调用它征询，一轮内可以多次。
      medium: |-
        向用户提问并等待回答。用于剧情方向不明、或用户指令与既有设定冲突时。**用户可以选一个，也可以都不选、自己写一条。**
        剧情走向以你为主。本轮若存在真正的分岔，可以调用一次让用户选。
      high: |-
        向用户提问并等待回答。用于剧情方向不明、或用户指令与既有设定冲突时。**用户可以选一个，也可以都不选、自己写一条。**
        除非存在使用户输入无法执行的必要歧义或冲突，否则不要调用。
specials:
  append:
    enabled: true
    mark: <用户追加输入>
    sections:
    - type: text
      role: user
      body: |-
        <用户追加输入>
        {{said}}
        </用户追加输入>
  no_input:
    enabled: true
    sections:
    - type: text
      role: user
      body: （没有新的用户输入，按当前设定继续推进。）
  nudge:
    enabled: true
    sections:
    - type: text
      role: user
      body: 请直接输出本轮细纲。
  nudge_final:
    enabled: true
    sections:
    - type: text
      role: user
      body: 这是最后一轮：请立即直接输出本轮细纲。
  converge:
    enabled: true
    sections:
    - type: text
      role: user
      body: 调查得差不多了，请开始收敛并直接输出细纲。
  segment:
    enabled: true
    sections:
    - type: text
      role: user
      body: |-
        本轮已经提交，以下指令与本轮内容无关。

        下面 {{open_runs}} 轮还没有归段：

        {{listing}}

        判断是否已经形成一个完整段落。段落通常包含多轮，只有在场景切换、时间跳转，或当前事件/对话已经明确结束时才分段。不要因为某一轮出现了局部收束就分段。
        如果存在明确分界，调用 close_segment，after 填分界所在的条目序号。分界可以早于最后一条。
        如果还没有明确分界，或无法确定，不要调用任何工具。
rendering:
  state_empty: （尚无记录）
  state_deeper: （{{count}} 项，用 state_query 展开）
  worldinfo_on_demand: （{{chars}} 字，用 worldinfo_read 展开）
  worldinfo_expand: 用 worldinfo_read 按名字展开。
  history_folded: |-
    （前 {{span}} 轮已压缩为摘要：{{summary}}
    如果需要原文，使用 history_read 展开 `{{key}}`。）
  history_folded_gone: |-
    （前 {{span}} 轮已压缩为摘要：{{summary}}）
  corpus_hit: 查到 {{count}} 段原文：
  corpus_passage: |-
    【{{name}} 第 {{start}}–{{end}} 字】
    {{text}}
  corpus_miss: 这次检索没有找到足够相关的段落（query：{{query}}）。修改query再查一次，或者不依赖资料继续。
  corpus_building: （{{names}} 还在建索引，查询无效。）
  flat_user_input: |-
    <用户输入>
    {{text}}
    </用户输入>
  flat_summary: |-
    （前 {{span}} 轮已压缩为摘要：{{summary}}
    如果需要原文，使用 `history_read` 按 ref `{{ref}}` 展开。）
  flat_summary_lost: |-
    （前 {{span}} 轮已压缩为摘要：{{summary}}）
