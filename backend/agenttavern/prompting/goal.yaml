# goal agent 的提示词（D28 / D141）。
#
# 它是一个**独立 agent**，三件事共用同一份上下文：把 goal 拆成阶段、检查阶段
# 达成没有并模拟下一条用户输入、全部阶段走完后判 goal 的去向。
# 所以 `sections` 只有一份，**任务由 `task` 那个选项组切**。
#
# 上下文只有四样：目标、阶段计划、剧情梗概（各轮细纲的摘要）、事件密度。
# **它不读正文**（同 D54 的理由），也不读世界设定和状态——它管的是"推到哪儿了"，
# 不是"这一轮怎么写"。
#
# ============================================================================
# 装配顺序 = 下面 `sections` 的顺序。一个条目 = 一条消息，role 写在条目上。
# 四种正文来源与 intro / outro 的用法见 director.yaml 开头。
# ============================================================================

sections:
  - {role: system, choice: task}
  - role: user
    title: 目标
    intro: 这是用户为本次创作设定的目标。
    context: goal
  - role: user
    title: 阶段计划
    intro: 这是当前的阶段拆分与进度。
    context: plan
  - role: user
    title: 剧情梗概
    intro: 这是已经写出来的剧情，按轮次顺序。
    context: digest
  - {role: user, title: 推进节奏, choice: pace}

# **`off` 档是给外部关的**（D140）：关掉之后这次调用没有任何指示，
# goal 机制失效。留这一档是为了能把它关掉。
task:
  "off": ""

  # -- 拆阶段 ---------------------------------------------------------------
  plan: |
    你在把一个创作目标拆成若干个**阶段性目标**。

    每个阶段要满足三条：
    - **是剧情里能发生的事**，不是抽象的进度描述。「他终于肯开口说那天的事」是阶段，「推进人物关系」不是。
    - **达成与否能被看出来**：读完那几轮剧情，能明确回答它发生了没有。
    - **前后有依赖**：后一个阶段要以前一个为前提，顺序不能随便换。

    阶段数按目标的体量定，通常三到六个。**不要为了凑数把一件事切成两半**，也不要把整个目标压成一个阶段——那样等于没拆。

    如果剧情梗概不为空，说明是**重新规划**：已经发生的事不要再列成阶段，从当前局面往下拆。

    输出格式，每行一个阶段，不要写别的：
    ```
    - 阶段的一句话描述
    ```

  # -- 检查进度 + 模拟用户输入 ------------------------------------------------
  step: |
    你在做两件事：核对阶段进度，然后替用户写出下一条输入。

    **先核对。** 逐个看阶段计划里还没达成的项，对照剧情梗概判断它现在达成了没有。判定从严：**剧情里真的发生了**才算达成，「正在朝那个方向走」不算。一轮可能跨过两个阶段，也可能一个阶段推好几轮都不算达成——**不要为了显得有进展而放宽标准**。

    **再写输入。** 你要扮演用户，写出他这一轮会说的话，把剧情往**当前这个未达成的阶段**推。

    这条输入的写法：
    - **是用户角色的动作或话**，不是给系统的指令。写「我把那张照片推过去」，不写「让林昭拿出照片」。
    - **一次只做一件事**（D26）：一个动作或一句话，不要把三步打包成一条。
    - **不要替其他角色决定反应**，那是 director 的事。
    - **不要提阶段、目标、进度**这些词——用户不知道有这些东西。
    - 顺着已经写出来的剧情接，不要跳过没写的部分。

    输出格式，两行，不要写别的：
    ```
    已达成：1,3     （本轮新达成的阶段序号；没有就写「无」）
    输入：用户这一轮说的话或做的事
    ```

  # -- 全部阶段走完后的判定 ---------------------------------------------------
  verdict: |
    阶段计划里的每一项都已标为达成。你要判断这个**目标**本身现在是什么状态。

    只看目标与剧情梗概，不要考虑写得好不好，也不要揣测后续打算。先逐条核对目标里的每一项要求是否都已出现在剧情中，**必须全部核对完**，不要看到部分符合就下结论。

    三种结论：
    - `完成`——目标的每一项要求都已在剧情里兑现。
    - `完全偏离`——剧情已经走到别处，目标在当前局面下不可能再达成了。**这一条要慎用**：只有当继续写下去也回不来时才选它。
    - `继续`——目标还没完全兑现，或者只是轻度偏离，从当前局面重新拆阶段还能接着推。

    最后单独一行输出结论：`完成`、`完全偏离` 或 `继续`。

# 推进节奏。**和 director 的事件密度是同一个控制维度**（D93 那条投影的第三面）：
# 铺陈少 → 一条输入可以推得远一点；铺陈多 → 一条输入只推一小步，
# 留出把过程写开的余地。
pace:
  sparse: 阶段可以拆得粗一些，每条输入推进的幅度可以大。
  normal: 阶段与输入都按自然节奏来。
  rich: 阶段拆得细一些，每条输入只推一小步，给互动过程留出空间。
