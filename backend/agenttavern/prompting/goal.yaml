# goal 判定的提示词（D28 / D140）。
#
# 这是 D17 判别式两个条件罕见地都满足的场合：有验证器（用户给的目标就是真值），
# 有上下文差（判定只需要 [目标 + 剧情梗概]，不需要创作过程）。所以它值得一次
# **独立的、干净上下文**的调用，而不是让生成模型顺手判断——生成模型知道自己
# 想怎么写，会往「已经达标」的方向读。
#
# ============================================================================
# 装配顺序 = 下面 `sections` 的顺序。一个条目 = 一条消息，role 写在条目上。
# ============================================================================

sections:
  - {role: system, choice: judging}
  - role: user
    title: 目标
    context: goal
  - role: user
    title: 剧情梗概
    context: digest

# **`off` 档是给外部关的**（D140）：关掉之后这次调用没有任何指示，
# 判定结果不可信，等于目标机制失效。留这一档是为了能把它关掉。
judging:
  "off": ""
  "on": |
    你在判断一个创作目标是否已经达成。只看给出的目标与剧情梗概，不要考虑写得好不好、也不要揣测后续打算。

    先逐条核对目标里的每一项要求是否都已出现在剧情中，**必须全部核对完**，不要看到部分符合就下结论。

    最后单独一行输出结论：`达成` 或 `未达成`。
