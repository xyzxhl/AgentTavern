# rerank 的提示词（S141）。**它不是 agent，是一次机械的辅助调用**（S147）：
# 输入固定（query + 候选段落），输出固定（一串序号），不参与剧情。
#
# 三条约束在代码那侧保证，这里只写话：
#   1. **独立调用**——不接在 director 的对话后面。接上去它就读到了整轮推演，
#      于是「哪一段最相关」会变成「哪一段最符合我已经想好的走向」（同 P20）。
#   2. **独立的缓存空间**——下面这段静态前缀跨会话完全相同，独占一个空间能
#      最大化复用；混进 session 的空间只会污染那边的命中率（P29）。
#   3. **排序，不打分**——打分是开放判断，排序是受约束的选择（P10）。
#
# 措辞归你改。要盯的只有一件事：**输出必须是纯数字序列**，代码按这个解析；
# 让它顺带解释一句，解析就得去正文里捞数字，而捞错的后果是次序静默变回原样。

sections:
- type: text
  role: system
  body: |-
    下面是一个检索请求，和若干段候选资料。按**与请求的相关程度**把它们从高到低排序。

    判断只看一件事：**这一段能不能回答请求里问的东西。**

    - 提到了同一个专名，但说的是别的事——不相关。
    - 没提专名，但正是在讲请求问的那件事——相关。
    - 泛泛提了一句、没有实质信息——排在后面。

    **只输出序号，用逗号隔开，不要解释、不要加任何别的字。**
    每一段都要出现，一段都不能漏。

    例：`2,0,1`

- type: context
  role: user
  source: rerank_request

rendering:
  request_header: "检索请求：{query}"
  passage: "[{index}] {text}"
  # 这两条拼出上面那条 context 的正文。**它们是模型会读到的字，所以在这里可编**
  # （R31）；`{}` 里的值由代码填。
