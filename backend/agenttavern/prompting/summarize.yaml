# summarize 的提示词（S25 / S10）。
#
# 它是一次**独立的、干净上下文**的调用：输入是一段剧情，输出是压缩后的摘要。
# **不是 agent，所以名字是个动词**（S147）——它是一次动作，不是一个角色。
#
# **`off` 档是给外部关的**：关掉之后这次调用没有任何指示，等于把摘要降级成
# 「原样截断」——那正是 S25 之前的状态，位置偏置的那个回退。留这一档是为了能把
# 它关掉，不是推荐这么做。

# -- 调用旋钮（S159）：用哪个模型、流不流、额外塞什么进请求体 --------------
#
# 它们按 agent 各设一份，因为它们本来就因 agent 而异。以前 `model` 和 `stream`
# 在 `.env` 里、全局一份，而它们全都在改「这一次调用长什么样」——那正是这份
# 文件管的事（同 S80 那次上调的判据）。
#
# `extra` **原样并进请求体**，一个字都不解释：思考模式那类参数各家拼法不同
# （`thinking: {type: enabled}` / `reasoning_effort: high` / `budget_tokens`），
# 定一套可移植的三档就要按家数映射，而猜错的症状是**不报错、只是没生效**。
model: deepseek-v4-flash
stream: true
extra: {}

sections:
- type: choice
  role: system
  name: compression
  selected: 'on'
  options:
    'off': ''
    'on': |-
      把下面这一段剧情压缩。只输出摘要本身。

      **取舍看的不是重要不重要，是丢了还能不能再找回来。**

      重要不重要是**事后**才知道的：一行不起眼的日期、一个随口提到的地名，
      当时谁也看不出它以后会成为关键。按“重要性”压缩，丢掉的正是这一类。

      - **优先留下具体的、独一份的东西**：数字、日期、金额、编号、地址、人名全称、
        物件的特征、写在纸上的字。它们占的字数很少，而**一旦丢了就永远回不来**。
      - **说死了的话逐字留**：承诺、否认、拒绝、给出的条件、报出的价钱。
        「他说没见过」和「他说不记得」不是一回事，不要归并成“他回避了”。
      - **该丢的是能再推出来的**：气氛、语气、评价、心理揣测、“关系变冷了”这类概括。
        它们从事实里随时能重新读出来，留着反而挤掉了具体的东西。

      写成陈述句，按发生顺序。不要加你自己的判断。
- type: context
  role: user
  source: content
