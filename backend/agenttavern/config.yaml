# 调参。**代码里不再写这些字面量**，要调就改这里。
#
# 和另外两处配置的分工：
#
# - `.env`（`Settings`）——**部署环境**：端点、key、模型、超时、数据目录。
#   秘密与机器相关的东西，不进版本控制。
# - **这份文件**——**全局默认**：各种上限、预算、窗口。它们是"调过就该重测"的
#   数，跟机器无关，也不该每个故事各写一遍。
# - `Capabilities` / `Goal`（session 级）——**每个故事不一样的东西**。
#   它们的默认值从这里取，单个 session 仍可覆盖。
#
# 这些数**没有一个是推导出来的**，全是实测调出来的。改之前先看注释里那条理由，
# 多数都记着"当初为什么是这个值"以及"调大调小各会坏成什么样"。

director:
  max_rounds: 24
  # 硬上限。撞上即强制收尾——tool 往返直接加在用户等待上（D7 已放弃流式）。

  soft_rounds: 16
  # 软上限。到此提示模型收敛，但不强制。

state_manager:
  max_rounds: 4
  # 正常一到两轮就完（写一次、然后空手回来收口）。这只是保底。

goal_manager:
  max_rounds: 4
  # 一轮里最多几次模型往返。正常一到两次（调工具、然后空手回来收口）。
  # 收口条件是「这一次不再调用工具」，而那是模型自己的选择——没有这条上限，
  # 一个每轮都再调一次的模型会把整条自动续跑的链卡死在这里。

  # 下面两条都是**止损**，不是预期值（D28）：模型可能永远判不达标，目标本身也
  # 可能不可达。**到顶不是失败，是暂停**——用户可以把上限调大接着跑（D148）。
  max_runs: 50
  max_total_tokens: 8000000
  # token 这条算的是**goal 跑起来之后花掉的全部**，不只是 goal_manager 自己的
  # 那几次调用——真正的钱花在它开出来的那些 run 上。实测一轮（细纲 + 正文 +
  # 状态 + 判定）约 17 万 token，50 轮约 850 万，两条上限的射程因此大致相当。
  # 以前只算 goal_manager 自己，这个数是 100 万；改成算全部之后照样填 100 万的话，
  # 六轮就撞顶，等于把 max_runs 架空了。
  # `max_revisions` 已删除（D148）：重拆不是「又失败了一次」，是脚手架跟着剧情走。

context:
  budget_chars: 96000
  # 整份对话越过它才压缩（D114）。**调小则压得勤、缓存反复失效；调大则单次更贵。**
  # 它不是模型的硬上限，是"多久动一次前缀"的旋钮——所以宁可偏大。

  state_inline_limit: 200
  # 单个状态**字符串**超过这个长度就只给体量，由模型按需 state_query 展开。
  # 清单和字典不适用：顶替掉它们会把形状一起顶替成字符串（D145）。

  tool_read_chars: 8000
  # 单次工具返回的体量上限。超了要**出声**，不能静默丢（D144）。

segment:
  summary_max_chars: 200
  max_runs: 6
  # 攒到这么多轮还没出现结尾就全压掉止损。
  min_runs: 1
  # **允许单轮成段**——一次干脆的转场本来就是一段。

sampling:
  # 采样标记的阈值。**从不影响运行时行为**（D43/D44），只是把可疑样本挑出来送审，
  # 所以这两个数偏松偏紧都不会弄坏产出，只影响送审量。
  expansion_min_ratio: 1.6
  state_value_max_chars: 60

windows:
  # 两个滑动窗口的默认值，`Capabilities` 里可以按 session 覆盖。
  upstream_runs: 3
  # 给 writer 几轮正文上文。它只用来接住语气，长程记忆是 director 的事。

  state_recent_runs: 3
  # 给 state_manager 几轮「细纲 → 成文 → 当时记下的」示范。
  # **这是整个系统里最贵的一段上下文**：滑动窗口，每轮全变，一点缓存都吃不到。
  # 实测 `data` 场景取 3 时它占掉全场 42% 的 input token。
