# 调参。**代码里不再写这些字面量**，要调就改这里。
#
# 和另外两处配置的分工：
#
# - `.env`（`Settings`）——**部署环境**：端点、key、模型、超时、数据目录。
#   秘密与机器相关的东西，不进版本控制。
# - **这份文件**——**全局默认**：各种上限、预算、窗口。它们是"调过就该重测"的
#   数，跟机器无关，也不该每个故事各写一遍。
# - `Capabilities` / `Goal`（session 级）——**每个故事不一样的东西**。
#   它们的默认值从这里取，单个 session 仍可覆盖。
#
# 这些数**没有一个是推导出来的**，全是实测调出来的。改之前先看注释里那条理由，
# 多数都记着"当初为什么是这个值"以及"调大调小各会坏成什么样"。

director:
  max_rounds: 24
  # 硬上限。撞上即强制收尾——tool 往返直接加在用户等待上（P21 已放弃流式）。

  soft_rounds: 16
  # 软上限。到此提示模型收敛，但不强制。

state_manager:
  max_rounds: 4
  # 正常一到两轮就完（写一次、然后空手回来收口）。这只是保底。

goal_manager:
  max_rounds: 4
  # 一轮里最多几次模型往返。正常一到两次（调工具、然后空手回来收口）。
  # 收口条件是「这一次不再调用工具」，而那是模型自己的选择——没有这条上限，
  # 一个每轮都再调一次的模型会把整条自动续跑的链卡死在这里。

  # `max_runs` / `max_total_tokens` **已从这里删除**（S97）。它们是**止损**，
  # 不是预期值（R24），而止损该由设目标的人当场决定：**留空就是不设上限**。
  # 在配置里放一个默认数，等于替没填的人做了决定——他不填不是"随便给个数"，
  # 是"别拦我"，然后在第 50 轮被一个自己没见过的数字拦下来，只会以为出了故障。
  # 止损另有出口：暂停、放弃，两个都在界面上一直看得见。
  # 参考量级（要填的时候心里有个数）：实测一轮（细纲 + 正文 + 状态 + 判定）
  # 约 17 万 token，所以 50 轮 ≈ 850 万。token 这条算的是**goal 跑起来之后花掉
  # 的全部**，不只是 goal_manager 自己那几次调用——真正的钱花在它开出来的 run 上。
  # `max_revisions` 已删除（S93）：重拆不是「又失败了一次」，是脚手架跟着剧情走。

context:
  budget_chars: 96000
  # 整份对话越过它才压缩（S60）。**调小则压得勤、缓存反复失效；调大则单次更贵。**
  # 它不是模型的硬上限，是"多久动一次前缀"的旋钮——所以宁可偏大。

  state_inline_limit: 200
  # 单个状态**字符串**超过这个长度就只给体量，由模型按需 state_query 展开。
  # 清单和字典不适用：顶替掉它们会把形状一起顶替成字符串（S119）。

  tool_read_chars: 8000
  # 单次工具返回的体量上限。超了要**出声**，不能静默丢（S26）。

segment:
  # `summary_max_chars` 已删除（S25）：那个数说了不算——实测 48 条摘要里 16 条
  # 超标，最坏 3.9 倍，且超出幅度随输入长度增长，而没有任何地方会发现。
  # 摘要长度改成**只统计不约束**（进 trace 与采集报告）。
  max_runs: 6
  # 攒到这么多轮还没出现结尾就全压掉止损。
  min_runs: 1
  # **允许单轮成段**——一次干脆的转场本来就是一段。

sampling:
  # 采样标记的阈值。**从不影响运行时行为**（P12/P12），只是把可疑样本挑出来送审，
  # 所以这两个数偏松偏紧都不会弄坏产出，只影响送审量。
  expansion_min_ratio: 1.6
  state_value_max_chars: 60

windows:
  # 两个滑动窗口的默认值，`Capabilities` 里可以按 session 覆盖。
  upstream_runs: 3
  # 给 writer 几轮正文上文。它只用来接住语气，长程记忆是 director 的事。

  state_recent_runs: 3
  # 给 state_manager 几轮「细纲 → 成文 → 当时记下的」示范。
  # **这是整个系统里最贵的一段上下文**：滑动窗口，每轮全变，一点缓存都吃不到。
  # 实测 `data` 场景取 3 时它占掉全场 42% 的 input token。

corpus:
  # 外部资料的切块与检索（S140/S142）。
  min_chars_per_page: 20
  # PDF **每页**至少要抽出几个字，低于它判成扫描件（S154）。
  # **门槛按页算不按总量**：一份一页五十字的便签是正常的，一份两百页零字的
  # 不是。第一版用绝对字数（100）当门槛，把前者一起拒了——那是这条的原始错误。
  # **调高**：更早拦住图片型 PDF；**调低**：让文字稀疏的排版（大量图表）过关，
  # 代价是真扫描件会溜进来，变成一份"建好了却查不到任何东西"的资料。

  chunk_chars: 400
  # 一块多少字。**调小**：每块更聚焦，但一个完整的说明会被切散，
  # 命中的那块看不出前因后果；**调大**：上下文更全，但一块里混着几件事，
  # BM25 的低频词优势被稀释，而且回给模型的体量线性上涨。

  chunk_overlap: 80
  # 相邻两块的重叠。**它不是可选的**：不重叠时正好跨在边界上的那句话被切成
  # 两半，两半各自都不足以命中，于是那句谁也检索不到——且没有任何地方会报错。
  # **必须小于 chunk_chars**，否则切块推不动（当场报错，不静默死循环）。

  embed_batch: 10
  # 建索引时 embeddings 一次发几块。**它是端点的限制，不是调优旋钮**——
  # 超限的报错发生在建索引跑到一半时，一本书建了三分钟才炸。
  #
  # 实测（2026-08-30，DashScope `qwen3.7-text-embedding`，每块 400 字）：
  # 20 条通过，21 条就回 `batch size is invalid, it should not be larger than 20`。
  # **各家的数不一样**，所以默认取 10 留一半余量；换端点前先照着量一次。
  # **调大**：建索引快些，但越接近某一家的上限越容易在半路炸。

  candidates: 20
  # BM25 与向量各取多少条送去 rerank。**调小**：rerank 便宜但召回不足，
  # 真正要的那段可能根本没进候选；**调大**：rerank 那次调用的输入线性上涨，
  # 而它是每次检索都要付的钱。

  top_k: 5
  # 最终回给模型几段。**这个数直接决定 director 上下文涨多少**——
  # 每段 400 字，5 段就是 2000 字，而它每次检索都进上下文。

  min_coverage: 0.5
  # 判定「这次算不算找到」的阈值：query 切出来的词，至少有这个比例落在命中的
  # 那一块里（S148）。**调高**：只在很确定时才返回，漏的多但端上来的都对得上；
  # **调低**：勉强沾边的也返回——而那比没有更糟，模型会把不相关的资料当成
  # 相关的用，写出一段有出处但出处对不上的东西。
  #
  # **不用 BM25 原始分当阈值**：它依赖这份资料的词频分布，换一份资料松紧就变了，
  # 而没有任何地方会报错。覆盖率是比例，跨资料可比。
  #
  # **它和 `corpus_search` 的工具描述是耦合的**（实测 2026-08-30）：问句里大半
  # 是疑问词（谁、哪、什么），资料里根本不会出现，覆盖率被稀释到阈值以下——
  #   「谁能驳回诏书？」→ 谁/能/驳回/诏书 → 0.25 ✗
  #   「封驳 涂归」    → 封驳/涂归      → 1.00 ✓
  # 所以 director.yaml 里那句「用资料里会出现的说法，不要问句」**不是文风建议，
  # 是 BM25 这一路能不能用上的开关**。改软了那句话，BM25 会静默地不再贡献任何
  # 候选，整条链路退化成纯向量——而没有任何地方会报错。

  min_similarity: 0.35
  # 向量那一侧的阈值：余弦相似度低于它就不算命中（S148）。
  # 余弦归一化到 [-1,1]，所以这个数**跨资料、跨 embedding 模型大体可比**
  # ——这正是不用 BM25 原始分当阈值的那条理由的另一面。
  #
  # **量过一次**（2026-08-30，qwen3.7-text-embedding，897 字资料，20 个问法）：
  #   答得上       0.5557 – 0.7433
  #   同领域答不上  0.4311 – 0.5812   ← 和上面重叠
  #   跨领域       0.2490 – 0.3426
  # 0.35 **干净地拦住跨领域那一档**，所以留着不改。但它拦不住「同领域但答不上」，
  # 而且没有任何阈值拦得住——那两档重叠。**那一档要靠专业 reranker 否决**
  # （S141），不要指望调这个数解决，调高只会开始误伤真答得上的。
  # 绝对值随资料规模上移（块越多，最相似的那块分越高），换资料要重量。

  min_relevance: 0.6
  # 专业 reranker 的**否决**阈值：低于它的候选一条都不返回（S141/S148）。
  # **这是 chat 模型那版做不到的事**——它只能重排，不能说"一条都不合适"。
  #
  # **这个数绑死在「哪一家 + 哪个模型」上**，换任何一样都要重量：各家的标定与
  # 训练目标不同，Cohere 的 0.5 和这里的 0.5 不是一回事（同 S148 反对拿 BM25
  # 原始分当阈值的那条罪）。下面这组量的是 **qwen / qwen3-rerank**。
  #
  # 实测（2026-08-31，13749 字 / 49 块，候选来自真实的混合检索，20 个 query）：
  #   答得上       0.7561 – 0.9433
  #   同领域答不上  0.2561 – 0.4307
  #   跨领域       —— 混合检索那一步就没候选，S148 的阈值已经拦住了
  # 空档 0.4307–0.7561，取中点。0.45–0.70 在这组数据上都是 0 漏 0 放。
  #
  # **偏高是有意的**：漏掉一条真的，回执是「这次没找到」，模型能换个说法再查；
  # 放过一条假的，它会当成事实写进剧情——**而且看不见**（S148）。
  # **调高**：更少误纳，但开始把真答得上的也判掉；**调低**：同领域但答非所问的
  # 段落开始混进来，那正是这条阈值要拦的东西。

  rrf_k: 60
  # RRF 融合的压平常数：score = Σ 1/(k + 名次)（S140）。
  # **调小**：头部权重变大，某一路的第一名更容易压过另一路的全部；
  # **调大**：两路趋于等权，名次之间的差别被抹平。
  #
  # 60 是这类融合的通用取值，**这个项目还没有数据支持任何别的值**。
  # 一个已知的性质：k 大的时候「一路第一一路垫底」和「两路都第二」几乎打平
  # （1/61+1/63 由凸性略大于 2/62，差 0.03%）——那不是缺陷，是 RRF 本来的样子。
