[project]
name = "agenttavern"
version = "0.1.0"
description = "Agent-based AI roleplay backend"
requires-python = ">=3.11"
# **每条都封主版本上界**（见 docs/Workflow.md）。这是一个应用不是一个库，没人需要它去适配未来的
# 大版本；而无上界意味着「同一份代码，今天装和明天装跑的是两套依赖」。
# 实测撞过一次：`openai>=1.55` 让 CI 装到 3.3.1（本地是 2.53.0），而 3.x 把
# HTTP 客户端从 `httpx` 换成了 `httpx2`，于是本地全绿、CI 上 mypy 直接红。
#
# `httpx2` 是 openai 3.x 要的那个；`httpx` 仍然直接依赖，因为 fastapi 的
# TestClient 用它。两个并存是设计使然——名字不同正是为了能同时装。
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "openai>=3.3,<4",
    "httpx2>=2.7,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "jieba>=0.42,<1",
    # 向量检索唯一的热点是全量点积。纯 Python 下几千块每次查询要 0.1–0.2 秒，
    # 而这是**每次检索都要付的**；numpy 下是毫秒级。`.npy` 也省得自己发明
    # 一套二进制浮点格式。它是本地依赖，不像 rerank 端点那样影响可移植性。
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenttavern"]

# 提示词 YAML 与 config.yaml 就躺在包目录里，hatchling 默认会一起打进去，
# 不需要 force-include。这里曾经指着 `agenttavern/agents/prompt_text`，那个
# 目录在提示词搬进 `prompting/*.yaml` 之后就没了（R31），而 force-include
# 指向不存在的路径会让 `pip install -e` 直接失败——**已装好的环境看不见这个**，
# 只有新机器上第一次装才会撞上。

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 系统 temp 目录在受限环境下可能不可写；固定到项目内。
# 超时：WebSocket 测试等不到消息时会永久阻塞，宁可让它失败也不要挂住。
addopts = "--basetemp=.pytest-tmp --timeout=30"

[tool.mypy]
python_version = "3.11"
strict = true

# jieba 没有 py.typed。**只放宽这一个模块**，不整体调低 strict——
# 为一个第三方库把全项目的检查降一档，代价会落在自己的代码上。
[[tool.mypy.overrides]]
module = ["jieba", "jieba.*"]
ignore_missing_imports = true

# numpy 2.x 的类型存根用了 3.12 的 `type` 语句，而这个项目按 3.11 检查
# （requires-python = ">=3.11"）。**只跳过它的存根，不放宽自己的代码**——
# 为一个第三方库把 python_version 抬上去，等于悄悄放弃 3.11 的兼容承诺。
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
