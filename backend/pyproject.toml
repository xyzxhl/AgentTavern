[project]
name = "agenttavern"
version = "0.1.0"
description = "Agent-based AI roleplay backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenttavern"]

# 提示词 YAML 与 config.yaml 就躺在包目录里，hatchling 默认会一起打进去，
# 不需要 force-include。这里曾经指着 `agenttavern/agents/prompt_text`，那个
# 目录在提示词搬进 `prompting/*.yaml` 之后就没了（D173），而 force-include
# 指向不存在的路径会让 `pip install -e` 直接失败——**已装好的环境看不见这个**，
# 只有新机器上第一次装才会撞上。

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 系统 temp 目录在受限环境下可能不可写；固定到项目内。
# 超时：WebSocket 测试等不到消息时会永久阻塞，宁可让它失败也不要挂住。
addopts = "--basetemp=.pytest-tmp --timeout=30"

[tool.mypy]
python_version = "3.11"
strict = true
