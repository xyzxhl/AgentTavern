[project]
name = "agenttavern"
version = "0.1.0"
description = "Agent-based AI roleplay backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenttavern"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 系统 temp 目录在受限环境下可能不可写；固定到项目内。
# 超时：WebSocket 测试等不到消息时会永久阻塞，宁可让它失败也不要挂住。
addopts = "--basetemp=.pytest-tmp --timeout=30"

[tool.mypy]
python_version = "3.11"
strict = true
